spring.application.name=bankease-backend

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/bankease_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.config.import=optional:classpath:secrets.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — Flyway owns the schema, Hibernate must NOT auto-create tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server port
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
app.jwt.expiration-ms=86400000
spring.jpa.open-in-view=false
logging.level.org.hibernate.orm.jta.platform=ERROR
springdoc.swagger-ui.path=/swagger-ui.html